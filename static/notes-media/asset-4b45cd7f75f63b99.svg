<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="连续电荷积分：先投影，再相加"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">连续电荷积分：先投影，再相加</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">成对电荷元的横向场抵消；dq 可以是一点，也可以先积成一个细环。</text><ellipse cx="245" cy="230" rx="65" ry="115" fill="none" stroke="#2867b2" stroke-width="2"/><path d="M160,230L710,230" fill="none" stroke="#64748b" stroke-width="2.5"/><circle cx="640" cy="230" r="5" fill="#b94236" stroke="#b94236" stroke-width="2"/><text x="650" y="223" fill="#25354a" font-size="17" text-anchor="start">P(x)</text><circle cx="245" cy="115" r="5" fill="#2867b2" stroke="#2867b2" stroke-width="2"/><text x="200" y="103" fill="#25354a" font-size="17" text-anchor="start">dq</text><path d="M245,115L640,230" fill="none" stroke="#2867b2" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M245,230L245,115" fill="none" stroke="#25816a" stroke-width="2.5"/><text x="260" y="180" fill="#25816a" font-size="17" text-anchor="start">R</text><path d="M640,230L743,260" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><path d="M640,230L743,230" fill="none" stroke="#25816a" stroke-width="2.5" marker-end="url(#a)"/><text x="695" y="290" fill="#b94236" font-size="18" text-anchor="start">dE</text><text x="690" y="212" fill="#25816a" font-size="18" text-anchor="start">dEx</text><text x="410" y="355" fill="#25354a" font-size="20" text-anchor="middle">dEx = k · dq · x / (R² + x²)^(3/2)</text></g></svg>