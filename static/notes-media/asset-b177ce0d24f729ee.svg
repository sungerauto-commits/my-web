<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="计数和等待：同一时间轴上的不同变量"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">计数和等待：同一时间轴上的不同变量</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><path d="M70,215L745,215" fill="none" stroke="#25354a" stroke-width="2.5" marker-end="url(#a)"/><circle cx="205" cy="215" r="7" fill="#b94236" stroke="#b94236" stroke-width="2"/><path d="M205,205L205,185" fill="none" stroke="#b94236" stroke-width="2.5"/><circle cx="365" cy="215" r="7" fill="#b94236" stroke="#b94236" stroke-width="2"/><path d="M365,205L365,185" fill="none" stroke="#b94236" stroke-width="2.5"/><circle cx="455" cy="215" r="7" fill="#b94236" stroke="#b94236" stroke-width="2"/><path d="M455,205L455,185" fill="none" stroke="#b94236" stroke-width="2.5"/><circle cx="680" cy="215" r="7" fill="#b94236" stroke="#b94236" stroke-width="2"/><path d="M680,205L680,185" fill="none" stroke="#b94236" stroke-width="2.5"/><path d="M85,285L205,285" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><text x="145" y="325" fill="#2867b2" font-size="18" text-anchor="middle">首次等待 T</text><text x="410" y="130" fill="#25354a" font-size="22" text-anchor="middle">固定窗口内事件个数：N(t)</text><text x="410" y="365" fill="#25354a" font-size="18" text-anchor="middle">若明确为恒定率泊松过程：P(T &gt; t) = P(N(t) = 0)</text></g></svg>