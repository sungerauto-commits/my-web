<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="固定体密度的绝缘球：挖孔用负密度补偿"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">固定体密度的绝缘球：挖孔用负密度补偿</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">此图是绝缘体的给定体密度，不是会重新分布电荷的导体。</text><circle cx="260" cy="225" r="135" fill="#eff5ff" stroke="#2867b2" stroke-width="2"/><circle cx="305" cy="200" r="55" fill="white" stroke="#b94236" stroke-width="2"/><circle cx="260" cy="225" r="3" fill="#25354a" stroke="#25354a" stroke-width="2"/><circle cx="305" cy="200" r="3" fill="#25354a" stroke="#25354a" stroke-width="2"/><path d="M260,225L305,200" fill="none" stroke="#25816a" stroke-width="2.5" marker-end="url(#a)"/><text x="235" y="248" fill="#25354a" font-size="17" text-anchor="start">O</text><text x="313" y="193" fill="#25354a" font-size="17" text-anchor="start">O′</text><text x="272" y="194" fill="#25816a" font-size="19" text-anchor="start">a</text><text x="125" y="155" fill="#2867b2" font-size="22" text-anchor="start">+ρ</text><text x="460" y="150" fill="#25354a" font-size="20" text-anchor="start">大球：E₁ = ρr / (3ε₀)</text><text x="460" y="210" fill="#25354a" font-size="20" text-anchor="start">补偿球：E₂ = −ρr′ / (3ε₀)</text><text x="460" y="280" fill="#25816a" font-size="22" text-anchor="start">r − r′ = a</text><text x="460" y="330" fill="#b94236" font-size="22" text-anchor="start">腔内 E = ρa / (3ε₀)</text></g></svg>