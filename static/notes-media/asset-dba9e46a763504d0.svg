<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="接地次序：每一阶段重新标 Q / V"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">接地次序：每一阶段重新标 Q / V</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><rect x="25" y="125" width="225" height="90" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="137.5" y="176.0" fill="#2867b2" font-size="17" text-anchor="middle">① 外壳接地</text><rect x="295" y="125" width="225" height="90" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="407.5" y="176.0" fill="#2867b2" font-size="17" text-anchor="middle">② 外壳断地</text><rect x="565" y="125" width="225" height="90" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="677.5" y="176.0" fill="#2867b2" font-size="17" text-anchor="middle">③ 内球接地</text><path d="M255,170L285,170" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M525,170L555,170" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><text x="137" y="260" fill="#25354a" font-size="16" text-anchor="middle">外壳 V = 0，可换电荷</text><text x="408" y="260" fill="#25354a" font-size="16" text-anchor="middle">外壳 Q 固定</text><text x="677" y="260" fill="#25354a" font-size="16" text-anchor="middle">内球 V = 0</text><text x="410" y="340" fill="#b94236" font-size="20" text-anchor="middle">最后外壳已孤立，不能再令它的 V = 0。</text></g></svg>