<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="先辨认随机变量记录的对象"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">先辨认随机变量记录的对象</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><rect x="25" y="105" width="240" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="145.0" y="146.0" fill="#2867b2" font-size="17" text-anchor="middle">固定 n 次，数成功次数</text><rect x="315" y="105" width="210" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="420.0" y="146.0" fill="#2867b2" font-size="17" text-anchor="middle">独立且同一概率 p</text><rect x="580" y="105" width="210" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="685.0" y="146.0" fill="#2867b2" font-size="17" text-anchor="middle">二项 B(n,p)</text><path d="M270,140L305,140" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,140L570,140" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="215" width="240" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="145.0" y="256.0" fill="#2867b2" font-size="17" text-anchor="middle">有限总体，不放回取 n 件</text><rect x="315" y="215" width="210" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="420.0" y="256.0" fill="#2867b2" font-size="17" text-anchor="middle">目标总数固定为 M</text><rect x="580" y="215" width="210" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="685.0" y="256.0" fill="#2867b2" font-size="17" text-anchor="middle">超几何分布</text><path d="M270,250L305,250" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,250L570,250" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><text x="410" y="355" fill="#b94236" font-size="18" text-anchor="middle">“直到首次成功”则改为停止次数；每次概率会变化时重新建路径。</text></g></svg>