<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="球对称：高斯面与带电体不是同一个面"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">球对称：高斯面与带电体不是同一个面</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><circle cx="300" cy="220" r="115" fill="#eff5ff" stroke="#2867b2" stroke-width="2"/><circle cx="300" cy="220" r="75" fill="none" stroke="#b94236" stroke-width="2" stroke-dasharray="7 6"/><circle cx="300" cy="220" r="155" fill="none" stroke="#25816a" stroke-width="2" stroke-dasharray="7 6"/><circle cx="300" cy="220" r="3" fill="#25354a" stroke="#25354a" stroke-width="2"/><path d="M300,220L415,220" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M300,220L355,168" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="216" fill="#2867b2" font-size="17" text-anchor="start">R</text><text x="345" y="161" fill="#b94236" font-size="17" text-anchor="start">r &lt; R</text><text x="470" y="145" fill="#25354a" font-size="17" text-anchor="start">实体球内：只包围半径 r 内电荷</text><text x="470" y="205" fill="#25354a" font-size="17" text-anchor="start">球外：包围总电荷 Q</text><text x="470" y="265" fill="#25354a" font-size="19" text-anchor="start">∮ E·dS = E(r) · 4πr²</text><text x="470" y="320" fill="#b94236" font-size="17" text-anchor="start">ρ 变化时，Q内必须积分。</text></g></svg>