<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="独立源置零：把约束值设成零"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">独立源置零：把约束值设成零</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">用于叠加与等效电阻计算；受控源保留。</text><rect x="35" y="110" width="290" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="180.0" y="151.0" fill="#2867b2" font-size="17" text-anchor="middle">理想电压源：u = 0</text><path d="M345,145L465,145" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M505,145L745,145" fill="none" stroke="#25354a" stroke-width="2.5"/><text x="620" y="180" fill="#25354a" font-size="18" text-anchor="middle">短路：两端等势</text><rect x="35" y="230" width="290" height="70" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="180.0" y="271.0" fill="#2867b2" font-size="17" text-anchor="middle">理想电流源：i = 0</text><path d="M345,265L465,265" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M505,265L590,265" fill="none" stroke="#25354a" stroke-width="2.5"/><path d="M655,265L745,265" fill="none" stroke="#25354a" stroke-width="2.5"/><circle cx="590" cy="265" r="5" fill="none" stroke="#2867b2" stroke-width="2"/><circle cx="655" cy="265" r="5" fill="none" stroke="#2867b2" stroke-width="2"/><text x="620" y="310" fill="#25354a" font-size="18" text-anchor="middle">开路：没有支路电流</text></g></svg>