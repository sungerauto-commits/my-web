<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="换路问题按三张图处理"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">换路问题按三张图处理</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><rect x="30" y="125" width="215" height="100" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="137.5" y="181.0" fill="#2867b2" font-size="17" text-anchor="middle">0⁻：原连接</text><rect x="300" y="125" width="215" height="100" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="407.5" y="181.0" fill="#2867b2" font-size="17" text-anchor="middle">0⁺：新连接</text><rect x="570" y="125" width="215" height="100" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="677.5" y="181.0" fill="#2867b2" font-size="17" text-anchor="middle">∞：新连接稳态</text><path d="M250,175L290,175" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M520,175L560,175" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><text x="136" y="258" fill="#25354a" font-size="17" text-anchor="middle">求原来的 uC、iL</text><text x="408" y="258" fill="#25354a" font-size="17" text-anchor="middle">保留状态，求其他量</text><text x="677" y="258" fill="#25354a" font-size="17" text-anchor="middle">电容开路、电感短路</text><text x="410" y="330" fill="#b94236" font-size="20" text-anchor="middle">连续：uC、iL；可跳变：iC、uL、节点电位。</text></g></svg>