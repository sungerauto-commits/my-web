<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="导体空腔：金属内为零场，腔内未必"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">导体空腔：金属内为零场，腔内未必</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start"></text><circle cx="275" cy="225" r="130" fill="#e8edf2" stroke="#64748b" stroke-width="2"/><circle cx="300" cy="215" r="72" fill="white" stroke="#2867b2" stroke-width="2"/><circle cx="300" cy="215" r="24" fill="#fff2ef" stroke="#b94236" stroke-width="2"/><text x="300" y="221" fill="#b94236" font-size="17" text-anchor="middle">+q</text><text x="300" y="167" fill="#2867b2" font-size="17" text-anchor="middle">内壁 −q</text><text x="273" y="81" fill="#25354a" font-size="19" text-anchor="start">外壁 Q₀ + q</text><text x="465" y="140" fill="#25354a" font-size="19" text-anchor="start">整个导体原来净电荷 Q₀</text><text x="465" y="200" fill="#25354a" font-size="19" text-anchor="start">金属区域：E = 0，V 为常数</text><text x="465" y="260" fill="#25354a" font-size="19" text-anchor="start">腔内：由 q 和内壁共同决定</text><text x="465" y="320" fill="#b94236" font-size="19" text-anchor="start">先定总量，再判断是否均匀。</text></g></svg>