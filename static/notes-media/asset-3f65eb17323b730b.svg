<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="从概率树读先验、似然与后验"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">从概率树读先验、似然与后验</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">只画通向“次品”的分支；完整概率树还包括各来源下的合格品分支。</text><circle cx="65" cy="210" r="5" fill="#25354a" stroke="#25354a" stroke-width="2"/><path d="M70,210L260,120" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M70,210L260,290" fill="none" stroke="#25816a" stroke-width="2.5" marker-end="url(#a)"/><text x="110" y="128" fill="#2867b2" font-size="18" text-anchor="start">甲 0.6</text><text x="110" y="300" fill="#25816a" font-size="18" text-anchor="start">乙 0.4</text><path d="M275,120L515,110" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><path d="M275,290L515,270" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><text x="320" y="94" fill="#25354a" font-size="17" text-anchor="start">次品率 0.01</text><text x="320" y="253" fill="#25354a" font-size="17" text-anchor="start">次品率 0.03</text><text x="535" y="115" fill="#b94236" font-size="19" text-anchor="start">甲且次品：0.006</text><text x="535" y="275" fill="#b94236" font-size="19" text-anchor="start">乙且次品：0.012</text><text x="410" y="365" fill="#25354a" font-size="18" text-anchor="middle">已知次品后，乙的后验 = 0.012 / (0.006 + 0.012) = 2/3</text></g></svg>