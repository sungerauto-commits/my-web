<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="参考方向与实际方向分开"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">参考方向与实际方向分开</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">参考流入负端：uₐᵦ = −Ri；电阻吸收功率仍为 +12 W。</text><rect x="305" y="135" width="200" height="75" rx="9" fill="#f5f8fb" stroke="#2867b2" stroke-width="2"/><text x="405.0" y="178.5" fill="#2867b2" font-size="17" text-anchor="middle">R = 3 Ω</text><path d="M90,172L305,172" fill="none" stroke="#25354a" stroke-width="2.5"/><path d="M505,172L740,172" fill="none" stroke="#25354a" stroke-width="2.5"/><text x="110" y="145" fill="#25354a" font-size="19" text-anchor="start">a：+6 V</text><text x="630" y="145" fill="#25354a" font-size="19" text-anchor="start">b：0 V</text><path d="M570,250L240,250" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="283" fill="#b94236" font-size="18" text-anchor="middle">电流参考：b → a</text><path d="M245,105L560,105" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="325" fill="#25354a" font-size="18" text-anchor="middle">uₐᵦ = +6 V，i = −2 A；实际电流为 a → b</text></g></svg>