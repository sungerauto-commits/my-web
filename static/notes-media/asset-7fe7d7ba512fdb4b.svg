<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="事件运算：先认重叠，才知道怎样计数"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">事件运算：先认重叠，才知道怎样计数</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">示意中的重叠只表示交集；独立性需要概率乘法检验，不能只看形状。</text><rect x="75" y="100" width="670" height="240" rx="12" fill="#f8fafc" stroke="#64748b"/><circle cx="340" cy="220" r="95" fill="#dceafb" stroke="#2867b2" stroke-width="2"/><circle cx="465" cy="220" r="95" fill="#f9e3df" stroke="#b94236" stroke-width="2"/><text x="290" y="220" fill="#2867b2" font-size="26" text-anchor="start">A</text><text x="500" y="220" fill="#b94236" font-size="26" text-anchor="start">B</text><text x="402" y="225" fill="#25354a" font-size="17" text-anchor="middle">A∩B</text><text x="100" y="128" fill="#25354a" font-size="22" text-anchor="start">Ω</text><text x="410" y="375" fill="#25354a" font-size="20" text-anchor="middle">P(A∪B) = P(A) + P(B) − P(A∩B)</text></g></svg>