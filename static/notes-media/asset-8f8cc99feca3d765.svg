<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="串联 RLC：电压作矢量相加"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">串联 RLC：电压作矢量相加</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">UL 向上、UC 向下；两者幅值不可直接与 UR 算术相加。</text><path d="M155,295L575,295" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M155,295L155,90" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M155,295L475,295" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M475,295L475,145" fill="none" stroke="#25816a" stroke-width="2.5" marker-end="url(#a)"/><path d="M155,295L475,145" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><text x="300" y="325" fill="#2867b2" font-size="19" text-anchor="start">UR = IR</text><text x="490" y="215" fill="#25816a" font-size="19" text-anchor="start">UL − UC</text><text x="280" y="195" fill="#b94236" font-size="19" text-anchor="start">总电压 U</text><text x="625" y="325" fill="#25354a" font-size="16" text-anchor="start">I 参考轴</text><text x="410" y="375" fill="#25354a" font-size="21" text-anchor="middle">U² = UR² + (UL − UC)²</text></g></svg>