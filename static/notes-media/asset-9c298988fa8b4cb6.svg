<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="介质界面：连续的是哪一个分量"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="820" height="390" rx="14" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="35" fill="#25354a" font-size="21" text-anchor="start">介质界面：连续的是哪一个分量</text><text x="25" y="64" fill="#64748b" font-size="14" text-anchor="start">图中场垂直界面；一般界面还需使用 E 的切向连续条件。</text><rect x="90" y="115" width="290" height="190" fill="#eff5ff"/><rect x="380" y="115" width="300" height="190" fill="#eff8f2"/><path d="M380,105L380,320" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M145,190L335,190" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M410,190L600,190" fill="none" stroke="#2867b2" stroke-width="2.5" marker-end="url(#a)"/><path d="M145,255L335,255" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><path d="M410,255L505,255" fill="none" stroke="#b94236" stroke-width="2.5" marker-end="url(#a)"/><text x="185" y="100" fill="#25354a" font-size="20" text-anchor="start">ε₁</text><text x="520" y="100" fill="#25354a" font-size="20" text-anchor="start">ε₂ = 2ε₁</text><text x="700" y="196" fill="#2867b2" font-size="18" text-anchor="start">Dn</text><text x="700" y="260" fill="#b94236" font-size="18" text-anchor="start">En</text><text x="410" y="360" fill="#25354a" font-size="20" text-anchor="middle">无自由面电荷：D₁n = D₂n，E₂n = E₁n / 2</text></g></svg>